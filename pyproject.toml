[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-api"
version = "27.3.2"
description = "GitLab API + MCP Server"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12"
dependencies = [ "agent-connector-sdk[mcp]>=0.3.5,<1.0.0", "python-dotenv>=1.2.4", "gql[requests]>=4.4.0",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-connector-sdk[mcp]>=0.3.5,<1.0.0",]
gql = [ "gql[requests]>=4.4.0",]
all = [ "gitlab-api[mcp,gql]>=27.2.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
gitlab-mcp = "gitlab_api.mcp_server:mcp_server"

[project.entry-points."agent_connector_sdk.skill_providers"]
gitlab-api = "gitlab_api.skills"

[project.entry-points."agent_connector_sdk.ontology_providers"]
gitlab-api = "gitlab_api.ontology"

[project.entry-points."agent_connector_sdk.source_connector_providers"]
gitlab-api = "gitlab_api.connectors"

[project.entry-points."agent_connector_sdk.prompt_providers"]
gitlab-api = "gitlab_api.prompts"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
gitlab_api = [ "mcp_config.json", "connector_manifest.yml", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
